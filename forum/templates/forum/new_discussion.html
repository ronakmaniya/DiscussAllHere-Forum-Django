{% extends "forum/base.html" %}
{% block title %} New Discussion {% endblock %}

{% block content %}
    <div class="form-card card fade-up">
        <h2 class="card-title" style="text-align: center; margin-bottom: 20px;">Create New Discussion</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="category">Category:</label>
            <select name="category" id="category" class="select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if selected_category and category.id == selected_category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                {% endfor %}
            </select>
            <input type="text" name="title" placeholder="Discussion Title" required class="input">
            <textarea name="content" placeholder="Content" rows="5" required class="textarea"></textarea>
            
            <div class="form-actions">
                <input type="submit" value="Post Discussion" class="btn btn-primary">
                {% if selected_category %}
                    <a href="{% url 'category_discussions' selected_category.slug %}" class="btn btn-secondary">Back</a>
                {% else %}
                    <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
                {% endif %}
            </div>
        </form>
    </div>
{% endblock %}
