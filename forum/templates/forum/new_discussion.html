{% extends "forum/base.html" %}
{% block title %}New Discussion{% endblock %}
{% block content %}
    <div class="form-container" style="background: #fff; padding: 20px; border: 1px solid #ddd; max-width: 600px; margin: auto;">
        <h2>Create New Discussion</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="category">Category:</label>
            <select name="category" id="category" style="width: 100%; padding: 10px; margin: 10px 0;" required>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
            <input type="text" name="title" placeholder="Discussion Title" required style="width: 100%; padding: 10px; margin: 10px 0;">
            <textarea name="content" placeholder="Content" rows="5" required style="width: 100%; padding: 10px; margin: 10px 0;"></textarea>
            <input type="submit" value="Post Discussion" style="padding: 10px; background: #444; color: #fff; border: none; cursor: pointer;">
        </form>
    </div>
{% endblock %}
