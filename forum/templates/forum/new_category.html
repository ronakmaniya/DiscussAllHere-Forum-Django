{% extends "forum/base.html" %}
{% block title %} New Category {% endblock %}

{% block content %}
<div class="form-card card fade-up">
    <h2 class="card-title" style="text-align: center; margin-bottom: 20px;">Add New Category</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="name">Category Name:</label>
        <input type="text" name="name" id="name" required class="input">
        {% if error_message %}
            <div class="error-text" style="font-size: 0.95em; margin-top: 5px;">{{ error_message }}</div>
        {% endif %}
        <div class="form-actions" style="margin-top: 20px;">
            <input type="submit" value="Add Category" class="btn btn-primary">
            <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
        </div>        
    </form>
</div>
{% endblock %}
