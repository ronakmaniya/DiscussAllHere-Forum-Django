<!DOCTYPE html>
<html>
<head>
    <title>DiscussAllHere - {% block title %}{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }

        .navbar { background: #333; color: #fff; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 10px; }
        .site-title { color: lightgreen; font-weight: bold; font-size: 1.5em; }
        .search-form input[type="text"] { padding: 5px; }
        .search-form input[type="submit"] { padding: 5px; }

        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown:hover .dropbtn { background-color: #555; }

        .content { padding: 20px; margin-bottom: 60px; }

        .nav-buttons { text-align: center; margin: 20px 0; }
        .nav-buttons button { padding: 10px 20px; margin: 0 5px; background: #444; color: #fff; border: none; cursor: pointer; }

        .footer { background: #333; color: #fff; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>

    <div class="navbar">
        <div>
            <a href="{% url 'home' %}" class="site-title" style="color: lightgreen;">DiscussAllHere</a>
            <a href="{% url 'home' %}">Home</a>

            <div class="dropdown" style="display:inline-block;">
                <button class="dropbtn">Categories</button>
                <div class="dropdown-content">
                    {% for cat in categories %}
                        <a href="{% url 'category_discussions' cat.id %}">{{ cat.name }}</a>
                    {% empty %}
                        <span style="padding:12px 16px; display:block;">No Categories</span>
                    {% endfor %}
                </div>
            </div>

            <a href="{% url 'about' %}">About/Help</a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
            <form action="{% url 'search' %}" method="GET" class="search-form" style="display:inline;">
                <input type="text" name="q" placeholder="Search...">
                <input type="submit" value="Search">
            </form>
        </div>
    </div>
    

    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <div class="nav-buttons">
        <button onclick="goBackAndRefresh();">Back</button>
        <button onclick="window.location.reload();">Refresh</button>
    </div>
    
    <div class="footer">
        © 2025 DiscussAllHere
    </div>

    <script>
        function goBackAndRefresh() {
            window.history.back();
            setTimeout(function() {
                window.location.reload();
            }, 500);
        }
    </script>
</body>
</html>
