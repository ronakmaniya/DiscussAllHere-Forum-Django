<!DOCTYPE html>
<html>
<head>
    <title>DiscussAllHere - {% block title %}{% endblock %}</title>
    <style>
        /* Global Styles */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        /* Navbar Styles */
        .navbar { background: #333; color: #fff; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #fff; text-decoration: none; margin: 0 10px; }
        .site-title { color: lightgreen; font-weight: bold; font-size: 1.5em; }
        .search-form input[type="text"] { padding: 5px; }
        .search-form input[type="submit"] { padding: 5px; }
        /* Content Area */
        .content { padding: 20px; margin-bottom: 60px; }
        /* Footer Styles */
        .footer { background: #333; color: #fff; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <!-- Header / Navbar -->
    <div class="navbar">
        <div>
            <a href="{% url 'home' %}" class="site-title">DiscussAllHere</a>
            <a href="{% url 'home' %}">Home</a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
            <form action="{% url 'search' %}" method="GET" class="search-form" style="display:inline;">
                <input type="text" name="q" placeholder="Search...">
                <input type="submit" value="Search">
            </form>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Footer -->
    <div class="footer">
        © 2025 DiscussAllHere
    </div>
</body>
</html>
