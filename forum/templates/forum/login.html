{% extends "forum/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="form-container" style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; max-width: 400px; margin: 50px auto;">
        <h2 style="text-align: center; color: #333; font-family: Arial, sans-serif;">Login</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input type="submit" value="Login" style="padding: 10px; background: #444; color: #fff; border: 1px solid #ccc; border-radius: 4px; width: 100%; cursor: pointer;">
        </form>
        <p style="text-align: center;">Don't have an account? <a href="{% url 'signup' %}" style="color: #333; text-decoration: none;">Signup here</a></p>
    </div>
{% endblock %}
