<!DOCTYPE html>
<html>
<head>
    <title>DiscussAllHere - Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .form-container { background-color: #fff; padding: 20px; border: 1px solid #ddd; max-width: 400px; margin: auto; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; }
        input[type="submit"] { background-color: #333; color: #fff; border: none; padding: 10px; width: 100%; cursor: pointer; }
        a { text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Signup</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Signup">
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
