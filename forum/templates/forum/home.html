{% extends "forum/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
    <h1>Discussion Categories</h1>
    {% for category in categories %}
        <div class="category" style="background: #fff; padding: 15px; margin: 10px 0; border: 1px solid #ddd;">
            <h2><a href="{% url 'category_discussions' category.id %}">{{ category.name }}</a></h2>
            <p>Discussions: {{ category.discussions.count }}</p>
        </div>
    {% empty %}
        <p>No categories available.</p>
    {% endfor %}
{% endblock %}
