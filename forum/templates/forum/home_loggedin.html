<!DOCTYPE html>
<html>
<head>
    <title>DiscussAllHere - Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #eef; }
        .navbar { background-color: #444; color: #fff; padding: 10px; text-align: right; }
        .navbar span { margin-right: 15px; }
        .navbar a { color: #fff; margin-left: 15px; text-decoration: none; }
        .container { padding: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>Welcome, {{ user.username }}</span>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
    <div class="container">
        <h1>Welcome to DiscussAllHere</h1>
        <p>You are logged in. Browse and participate in discussions.</p>
        <a href="{% url 'discussion_list' %}">View Discussions</a>
        <br><br>
        <a href="{% url 'new_discussion' %}">Start a New Discussion</a>
    </div>
</body>
</html>
