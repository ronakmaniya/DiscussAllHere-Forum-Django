<!DOCTYPE html>
<html>
<head>
    <title>DiscussAllHere - Discussion Detail</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .navbar { background-color: #333; color: #fff; padding: 10px; text-align: right; }
        .navbar a { color: #fff; margin-left: 15px; text-decoration: none; }
        .discussion-detail { border: 1px solid #ddd; padding: 20px; background-color: #fff; }
    </style>
</head>
<body>
    <div class="navbar">
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
        {% endif %}
    </div>
    <div class="discussion-detail">
        <h2>{{ discussion.title }}</h2>
        <p>{{ discussion.content }}</p>
        <small>By {{ discussion.author.username }} on {{ discussion.created_at }}</small>
    </div>
    <br>
    <a href="{% url 'discussion_list' %}">Back to Discussions</a>
</body>
</html>
